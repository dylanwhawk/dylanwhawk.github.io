<text x="32" y="70" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start"><tspan x="32" dy="0">The model has not seen the task. Its guess at what gets rewarded</tspan><tspan x="32" dy="21">is its prior from training, which covers most of the plane.</tspan></text>
