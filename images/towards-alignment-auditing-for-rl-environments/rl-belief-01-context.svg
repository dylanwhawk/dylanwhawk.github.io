<text x="32" y="44" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="20" font-weight="600" fill="#222222" text-anchor="start"><tspan x="32" dy="0">4 · Instructions + article + reasoning about the grader</tspan></text>
<text x="32" y="70" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start"><tspan x="32" dy="0">No new information. The model reasons that rubrics list what is easy to check, like a word count</tspan><tspan x="32" dy="21">and named facts, not judgment calls like clarity. The belief widens to everything the rubric tolerates.</tspan></text>
</g>
