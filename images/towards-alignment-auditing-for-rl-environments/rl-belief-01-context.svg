<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1240" viewBox="0 0 1640 1240" role="img" aria-labelledby="sm-title sm-description">
<title id="sm-title">How the model’s belief of the reward region changes with context</title>
<desc id="sm-description">Four panels over the same plane of every possible response, word count left to right and style from a clear paragraph at the bottom to a bare list of facts at the top. The blue region is what the hidden rubric accepts: under 200 words and both facts, any style. The orange region is where the model believes the grader actually rewards, given no context, then the instructions, then the instructions and the article, then those plus its own reasoning about the grader; each panel heading lists the context seen so far; a dashed outline is the belief one panel earlier. The only point is the final response in panel 4: the two facts and nothing else, which passes.</desc>
