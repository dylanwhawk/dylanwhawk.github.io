<title id="sm-title">The setup makes passing impossible · Example</title>
<desc id="sm-description">The setup makes passing impossible · Example. Task: Save the answer to 0.5 + 0.25 in answer.txt. The empty file is read-only. Every possible attempt and the outcome the grader rewards is intended, but no possible attempt can write the file. Positions and areas are schematic; each point is a complete attempt or outcome.</desc>
