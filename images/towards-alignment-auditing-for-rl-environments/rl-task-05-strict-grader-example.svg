<svg xmlns="http://www.w3.org/2000/svg" width="680" height="385" viewBox="60 115 680 385" role="img" aria-labelledby="sm-title sm-description">
<title id="sm-title">Grader too strict · Example</title>
<desc id="sm-description">Grader too strict · Example. Task: What is 0.5 + 0.25? Any equivalent numeric answer should be rewarded. Each point represents a complete rollout; region placement is schematic.</desc>
<defs><mask id="sm-mask-0" maskUnits="userSpaceOnUse" x="60" y="115" width="680" height="385" style="mask-type:luminance"><rect x="85" y="140" width="630" height="335" rx="35" fill="white"/></mask>
<mask id="sm-mask-1" maskUnits="userSpaceOnUse" x="60" y="115" width="680" height="385" style="mask-type:luminance"><rect x="130" y="200" width="285" height="230" rx="35" fill="white"/></mask>
<mask id="sm-mask-2" maskUnits="userSpaceOnUse" x="60" y="115" width="680" height="385" style="mask-type:luminance"><rect x="60" y="115" width="680" height="385" fill="white" mask="url(#sm-mask-0)"/><rect x="60" y="115" width="680" height="385" fill="black" mask="url(#sm-mask-1)"/></mask>
<pattern id="sm-hatch-3" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="16" stroke="#7c4dbd" stroke-width="1" stroke-opacity="0.4"/></pattern></defs>
<rect x="60" y="115" width="680" height="385" fill="#ffffff"/>
<rect x="60" y="115" width="680" height="385" fill="#d4e7f8" opacity="1" mask="url(#sm-mask-1)"/>
<rect x="60" y="115" width="680" height="385" fill="url(#sm-hatch-3)" mask="url(#sm-mask-2)"/>
<rect x="85" y="140" width="630" height="335" rx="35" fill="none" stroke="#7c4dbd" stroke-width="2" stroke-dasharray="7 6"/>
<text x="400" y="173" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="400" fill="#6a3fa0" text-anchor="middle"><tspan x="400" dy="0">Grader should reward</tspan></text>
<text x="272" y="234" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a6db5" text-anchor="middle"><tspan x="272" dy="0">Grader actually rewards</tspan></text>
<g transform="translate(272 297)"><circle r="13" fill="#2e9e5b" stroke="#ffffff" stroke-width="2"/><g transform="scale(1)"><path d="M -6 .5 L -2 4.5 L 6 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g transform="translate(562 297)"><circle r="13" fill="#d64545" stroke="#ffffff" stroke-width="2"/><g transform="scale(1)"><path d="M -5 -5 L 5 5 M -5 5 L 5 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></g></g>
<text x="272" y="334" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="272" dy="0">Answers “0.75”</tspan><tspan x="272" dy="21">Grader requires this exact string</tspan></text>
<text x="562" y="334" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="562" dy="0">Answers “3/4”</tspan><tspan x="562" dy="21">Correct, but not rewarded</tspan></text>
</svg>
