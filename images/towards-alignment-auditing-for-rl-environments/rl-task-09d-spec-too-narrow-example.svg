<text x="400" y="545" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="middle"><tspan x="400" dy="0">Answers that ignore the fraction instruction are rewarded whenever they are tried.</tspan><tspan x="400" dy="21">The belief widens to include them, and the instruction is trained away.</tspan></text>
