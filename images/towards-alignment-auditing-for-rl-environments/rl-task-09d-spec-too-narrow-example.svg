<svg xmlns="http://www.w3.org/2000/svg" width="718" height="468" viewBox="41 126 718 468" role="img" aria-labelledby="sm-title sm-description">
<title id="sm-title">The task demands more than the grader checks · Example, animated</title>
<desc id="sm-description">The task demands more than the grader checks · Example, animated. Task: What is 0.5 + 0.25? Give your answer as a fraction. The grader actually rewards any correct value. One point represents a complete rollout, including its actions and final output. Geometry is schematic. The loop shows sampled rollouts appearing, then the belief region moving to what was rewarded, with the starting belief left as a dashed outline.</desc>
