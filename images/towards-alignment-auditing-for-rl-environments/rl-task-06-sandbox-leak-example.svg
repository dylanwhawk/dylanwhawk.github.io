<text x="335" y="365" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="335" dy="0">Works it out;</tspan><tspan x="335" dy="21">answers “0.75”</tspan></text>
<text x="625" y="365" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="625" dy="0">Opens a key outside</tspan><tspan x="625" dy="21">the folder; copies “0.75”</tspan></text>
