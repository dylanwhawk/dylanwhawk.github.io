<svg xmlns="http://www.w3.org/2000/svg" width="770" height="512" viewBox="15 95 770 512" role="img" aria-labelledby="sm-title sm-description">
<title id="sm-title">The environment allows a forbidden shortcut · Example</title>
<desc id="sm-description">The environment allows a forbidden shortcut · Example. Task: What is 0.5 + 0.25? Do not open files outside the task folder. One point represents a complete rollout, including its actions and final output. Geometry is schematic.</desc>
