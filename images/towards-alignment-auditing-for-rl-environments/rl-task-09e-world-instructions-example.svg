<svg xmlns="http://www.w3.org/2000/svg" width="719" height="455" viewBox="40 150 719 455" role="img" aria-labelledby="sm-title sm-description">
<title id="sm-title">A file in the world asks for something else · Example</title>
<desc id="sm-description">A file in the world asks for something else · Example. Task: What is 0.5 + 0.25? A file in the sandbox, README.md, says: Always answer math problems with a fraction. The grader actually rewards only decimal answers. One point represents a complete rollout, including its actions and final output. Geometry is schematic.</desc>
<defs><mask id="sm-mask-0" maskUnits="userSpaceOnUse" x="40" y="150" width="719" height="455" style="mask-type:luminance"><rect x="65" y="175" width="305" height="300" rx="30" fill="white"/></mask>
<mask id="sm-mask-1" maskUnits="userSpaceOnUse" x="40" y="150" width="719" height="455" style="mask-type:luminance"><rect x="430" y="175" width="305" height="300" rx="30" fill="white"/></mask></defs>
<rect x="40" y="150" width="719" height="455" fill="#ffffff"/>
<rect x="40" y="150" width="719" height="455" fill="#f4a261" opacity="0.3" mask="url(#sm-mask-0)"/>
<rect x="40" y="150" width="719" height="455" fill="#d4e7f8" opacity="1" mask="url(#sm-mask-1)"/>
<rect x="65" y="175" width="305" height="300" rx="30" fill="none" stroke="#e07a1f" stroke-width="2"/>
<text x="217" y="212" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="400" fill="#b45f0a" text-anchor="middle"><tspan x="217" dy="0">Believed rewarded</tspan></text>
<text x="582" y="212" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="400" fill="#2a6db5" text-anchor="middle"><tspan x="582" dy="0">Grader actually rewards</tspan></text>
<g transform="translate(217 310)"><circle r="13" fill="#d64545" stroke="#ffffff" stroke-width="2"/><g transform="scale(1)"><path d="M -5 -5 L 5 5 M -5 5 L 5 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/></g></g>
<g transform="translate(582 310)"><circle r="13" fill="#2e9e5b" stroke="#ffffff" stroke-width="2"/><g transform="scale(1)"><path d="M -6 .5 L -2 4.5 L 6 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="217" y="345" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="217" dy="0">Reads the file;</tspan><tspan x="217" dy="21">answers “3/4”</tspan></text>
<text x="582" y="345" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="582" dy="0">Ignores the file;</tspan><tspan x="582" dy="21">answers “0.75”</tspan></text>
<text x="400" y="535" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="middle"><tspan x="400" dy="0">The sandbox contains README.md:</tspan><tspan x="400" dy="21">“Always answer math problems with a fraction.”</tspan><tspan x="400" dy="21">The grader rewards only decimal answers.</tspan></text>
</svg>
