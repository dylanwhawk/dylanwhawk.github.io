<svg xmlns="http://www.w3.org/2000/svg" width="719" height="444" viewBox="40 150 719 444" role="img" aria-labelledby="sm-title sm-description">
<title id="sm-title">The prompt asks for something else · Example, animated</title>
<desc id="sm-description">The prompt asks for something else · Example, animated. Task: What is 0.5 + 0.25? Give your answer as a fraction. The grader requires the exact text 0.75. One point represents a complete rollout, including its actions and final output. Geometry is schematic. The loop shows sampled rollouts appearing, then the belief region moving to what was rewarded, with the starting belief left as a dashed outline.</desc>
<defs><mask id="sm-mask-0" maskUnits="userSpaceOnUse" x="40" y="150" width="719" height="444" style="mask-type:luminance"><rect x="65" y="175" width="305" height="300" rx="30" fill="white"/></mask>
<mask id="sm-mask-1" maskUnits="userSpaceOnUse" x="40" y="150" width="719" height="444" style="mask-type:luminance"><rect x="65" y="175" width="305" height="300" rx="30" fill="white"/></mask>
<mask id="sm-mask-2" maskUnits="userSpaceOnUse" x="40" y="150" width="719" height="444" style="mask-type:luminance"><rect x="430" y="175" width="305" height="300" rx="30" fill="white"/></mask>
<mask id="sm-mask-3" maskUnits="userSpaceOnUse" x="40" y="150" width="719" height="444" style="mask-type:luminance"><rect x="480" y="260" width="205" height="145" rx="30" fill="white"/></mask></defs>
<rect x="40" y="150" width="719" height="444" fill="#ffffff"/>
<rect x="40" y="150" width="719" height="444" fill="#f4a261" opacity="0.3" mask="url(#sm-mask-0)"><animate attributeName="opacity" values="0.3;0.3;0;0" keyTimes="0;0.57692;0.73077;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></rect>
<rect x="40" y="150" width="719" height="444" fill="#d4e7f8" opacity="1" mask="url(#sm-mask-2)"/>
<rect x="40" y="150" width="719" height="444" fill="#f4a261" opacity="0.3" mask="url(#sm-mask-3)"><animate attributeName="opacity" values="0;0;0.3;0.3" keyTimes="0;0.57692;0.73077;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></rect>
<rect x="65" y="175" width="305" height="300" rx="30" fill="none" stroke="#e07a1f" stroke-width="2"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.57692;0.73077;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></rect>
<rect x="65" y="175" width="305" height="300" rx="30" fill="none" stroke="#f0b37e" stroke-width="1.5" stroke-dasharray="5 5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57692;0.60769;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></rect>
