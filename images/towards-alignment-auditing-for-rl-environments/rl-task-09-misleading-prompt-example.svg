<text x="217" y="212" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="16" font-weight="400" fill="#c8955a" text-anchor="middle"><tspan x="217" dy="0">Believed rewarded</tspan><tspan x="217" dy="21">(before training)</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57692;0.60769;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></text>
