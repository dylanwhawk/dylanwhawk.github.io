<text x="285" y="335" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="285" dy="0">“6/8”</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.23077;0.26154;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></text>
<text x="217" y="420" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="217" dy="0">“75/100”</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34615;0.37692;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></text>
<text x="582" y="380" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="582" dy="0">“0.75”</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.46154;0.49231;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></text>
<text x="400" y="545" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="14" font-weight="400" fill="#222222" text-anchor="middle"><tspan x="400" dy="0">Answers that follow the prompt get no reward; one exploratory answer that ignores it is rewarded.</tspan><tspan x="400" dy="21">The belief moves onto what was rewarded, and the model learns to distrust the prompt.</tspan></text>
</svg>
