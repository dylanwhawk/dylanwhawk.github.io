<text x="582" y="283" font-family="system-ui, -apple-system, &apos;Helvetica Neue&apos;, Arial, sans-serif" font-size="15" font-weight="400" fill="#b45f0a" text-anchor="middle"><tspan x="582" dy="0">Believed rewarded</tspan><tspan x="582" dy="21">(after training)</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57692;0.73077;1" dur="13s" repeatCount="indefinite" calcMode="linear"/></text>
